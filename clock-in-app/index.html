<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星光打卡 · 员工考勤与工资</title>
<style>
:root{
  --bg:#05061a;
  --line:rgba(255,255,255,.12);
  --txt:#EEF0FF; --muted:#9AA0C3; --dim:#6B7096;
  --gold:#FFD36E; --mint:#3EF0B5; --violet:#8B7BFF; --pink:#FF6FB5; --cyan:#4CC9FF;
  --amber:#FFB547; --orange:#FF8A4C; --red:#FF5470;
  --r:22px;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt)}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(139,123,255,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景 ---------- */
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:90}
.aurora{position:fixed;inset:-20%;z-index:0;filter:blur(90px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;width:46vw;height:46vw;border-radius:50%;mix-blend-mode:screen;animation:float 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:radial-gradient(circle,#6d28d9,transparent 65%);left:4%;top:2%}
.aurora i:nth-child(2){background:radial-gradient(circle,#0ea5e9,transparent 65%);right:2%;top:18%;animation-duration:30s}
.aurora i:nth-child(3){background:radial-gradient(circle,#db2777,transparent 65%);left:32%;bottom:-6%;animation-duration:36s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vh) scale(1.15)}100%{transform:translate(-6vw,-4vh) scale(.92)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:3px 3px}

#app{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:18px 26px 48px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:1px}
.brand .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:conic-gradient(from 200deg,#FFD36E,#FF6FB5,#8B7BFF,#4CC9FF,#3EF0B5,#FFD36E);box-shadow:0 8px 30px -6px rgba(255,111,181,.7);animation:spin 12s linear infinite}
.brand .logo span{animation:spin 12s linear infinite reverse}
.shimmer{background:linear-gradient(90deg,#fff 0%,#FFD36E 25%,#FF6FB5 50%,#8B7BFF 75%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
@keyframes shim{to{background-position:200% center}}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:3px}
.tabs{position:relative;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);backdrop-filter:blur(14px);margin:0 auto}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:9px 18px;border-radius:999px;cursor:pointer;color:var(--muted);transition:color .3s;white-space:nowrap}
.tabs button.on{color:#fff}
.tabs button:hover{color:#fff}
.tab-ind{position:absolute;top:5px;bottom:5px;border-radius:999px;background:linear-gradient(135deg,rgba(139,123,255,.9),rgba(255,111,181,.85));box-shadow:0 6px 24px -4px rgba(139,123,255,.8);transition:left .5s cubic-bezier(.2,.9,.25,1.15),width .5s cubic-bezier(.2,.9,.25,1.15)}
.top-right{display:flex;align-items:center;gap:10px}
.chip-pay{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(255,211,110,.18),rgba(255,138,76,.12));border:1px solid rgba(255,211,110,.35);color:var(--gold);font-weight:600;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;font-size:16px;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}

/* ---------- 卡片 ---------- */
.card{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.10),transparent 45%)}
.card:hover::before{opacity:1}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tab{display:none}
.tab.active{display:block}
.tab.enter .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{transform:rotate(360deg)}}

.grid{display:grid;gap:18px}
.g-top{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1060px){.g-top,.g-3,.g-2{grid-template-columns:1fr}}
.mt{margin-top:18px}

/* ---------- 时钟 ---------- */
.hero{padding:28px 30px;min-height:100%}
.greet{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.greet .wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.clock{margin:14px 0 2px;font-size:clamp(64px,7.4vw,112px);font-weight:200;line-height:1;letter-spacing:2px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;
  filter:drop-shadow(0 0 24px rgba(139,123,255,.55))}
.clock span{display:inline-block;background:linear-gradient(180deg,#fff 20%,#b9b2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock span.tick{animation:tick .45s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{transform:translateY(-14px);opacity:.2}to{transform:none;opacity:1}}
.clock b{font-weight:200;color:rgba(255,255,255,.45);margin:0 4px;animation:blink 1s steps(1) infinite}
.clock .sec{font-size:.42em;margin-left:6px;background:linear-gradient(180deg,#FFD36E,#FF6FB5);-webkit-background-clip:text;background-clip:text}
@keyframes blink{50%{opacity:.25}}
.date{color:var(--muted);font-size:15px;letter-spacing:1px}
.cds{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.cd{flex:1;min-width:200px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.cd .k{font-size:12px;color:var(--muted)}
.cd .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.cd.ok .v{color:var(--mint)}
.cd.warn .v{color:var(--amber)}
.cd.over .v{color:var(--dim);font-size:15px}

.timeline{position:relative;margin:26px 4px 6px;height:58px}
.tl-bar{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06)}
.tl-seg{position:absolute;top:0;bottom:0}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.28));transition:width 1s linear}
.tl-mark{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-mark::after{content:"";position:absolute;left:50%;top:17px;width:1px;height:20px;background:rgba(255,255,255,.35)}
.tl-tick{position:absolute;top:40px;font-size:10px;color:var(--dim);transform:translateX(-50%)}
.tl-now{position:absolute;top:14px;width:2px;height:26px;background:#fff;border-radius:2px;box-shadow:0 0 12px #fff,0 0 30px var(--violet);transform:translateX(-1px);transition:left 1s linear}
.tl-now::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:#fff;box-shadow:0 0 14px #fff}
.tl-dot{position:absolute;top:19px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:2px solid #fff;box-shadow:0 0 14px currentColor}
.tl-dot.in{background:var(--cyan);color:var(--cyan)}
.tl-dot.done{background:var(--gold);color:var(--gold)}
.quote{margin-top:18px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(139,123,255,.12),rgba(255,111,181,.08));border:1px solid rgba(139,123,255,.25);font-size:14px;line-height:1.7;transition:opacity .6s,transform .6s}
.quote.fade{opacity:0;transform:translateY(6px)}

/* ---------- 打卡面板 ---------- */
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.picker{display:flex;gap:8px;flex-wrap:wrap;max-height:126px;overflow:auto;padding:2px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;transition:.25s;position:relative}
.chip:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.08)}
.chip.on{border-color:transparent;background:linear-gradient(135deg,rgba(139,123,255,.45),rgba(255,111,181,.35));box-shadow:0 6px 22px -6px rgba(255,111,181,.7)}
.chip .sd{width:8px;height:8px;border-radius:50%;background:var(--sc,transparent);box-shadow:0 0 8px var(--sc,transparent)}
.who{display:flex;align-items:center;gap:16px;margin:18px 0 16px}
.who .big-av{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:36px;position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--line)}
.who .big-av::after{content:"";position:absolute;inset:-3px;border-radius:22px;padding:2px;background:conic-gradient(from var(--a,0deg),#FFD36E,#FF6FB5,#8B7BFF,#4CC9FF,#3EF0B5,#FFD36E);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite}
.who .name{font-size:22px;font-weight:800}
.who .tags{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted)}
.tag.fire{color:#FFB547;border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1)}

.pbtn{--c1:#4CC9FF;--c2:#8B7BFF;--c3:#3EF0B5;position:relative;display:block;width:100%;border:0;padding:2px;border-radius:26px;cursor:pointer;overflow:hidden;background:transparent;isolation:isolate;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1.3);margin-bottom:14px}
.pbtn.task{--c1:#FFD36E;--c2:#FF6FB5;--c3:#FF8A4C}
.pbtn::before{content:"";position:absolute;inset:-80%;z-index:-2;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 3.2s linear infinite}
.pbtn .in{position:relative;display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:24px;background:linear-gradient(135deg,rgba(14,15,40,.94),rgba(28,20,62,.9));overflow:hidden}
.pbtn .in::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:140%}}
.pbtn .ico{flex:none;width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 30px -6px var(--c2)}
.pbtn .t1{font-size:22px;font-weight:800;letter-spacing:1px}
.pbtn .t2{font-size:13px;color:var(--muted);margin-top:4px}
.pbtn .arrow{margin-left:auto;font-size:22px;opacity:.6;transition:transform .3s}
.pbtn:hover{transform:translateY(-3px) scale(1.012)}
.pbtn:hover .arrow{transform:translateX(5px);opacity:1}
.pbtn:active{transform:scale(.975)}
.pbtn.ready{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(139,123,255,0)}50%{box-shadow:0 0 36px 2px color-mix(in srgb,var(--c2) 55%,transparent)}}
.pbtn.done::before{animation:none;background:linear-gradient(135deg,rgba(62,240,181,.75),rgba(62,240,181,.2))}
.pbtn.done .in::after{display:none}
.pbtn.done .ico{background:linear-gradient(135deg,#3EF0B5,#1fb88a);box-shadow:0 10px 26px -6px rgba(62,240,181,.8)}
.pbtn.locked{cursor:not-allowed;filter:saturate(.25) brightness(.8)}
.pbtn.locked::before{animation:none}
.pbtn.locked:hover{transform:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.35);animation:rip .7s ease-out forwards;pointer-events:none;z-index:3}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* ---------- 统计卡 ---------- */
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.big-status{display:flex;align-items:center;gap:14px}
.big-status .e{font-size:44px;filter:drop-shadow(0 6px 18px rgba(255,255,255,.25));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.big-status .l{font-size:20px;font-weight:800}
.money{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#FFF3C4,#FFD36E 50%,#FF9F43);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,211,110,.35))}
.money.sm{font-size:24px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px}
.kv:last-child{border:0}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c-bg{stroke:rgba(255,255,255,.08)}
.ring .c-fg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(255,211,110,.7))}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{font-size:26px;font-weight:800}
.ring .ctr small{display:block;color:var(--muted);font-size:11px}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1}
.mini div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:18px;color:var(--txt)}
.countdown-big{display:flex;align-items:baseline;gap:6px}
.countdown-big b{font-size:64px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#FFD36E);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,211,110,.45))}
.payday-today{font-size:28px;font-weight:900}

/* 团队 */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mate{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:.25s}
.mate:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.mate .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.07)}
.mate .nm{font-weight:700}
.mate .tm{font-size:12px;color:var(--muted);margin-top:2px}
.mate .pill{margin-left:auto}

.pill{--sc:#8B7BFF;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;white-space:nowrap;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,transparent);border:1px solid color-mix(in srgb,var(--sc) 40%,transparent)}
.st-normal{--sc:#3EF0B5}.st-late{--sc:#FFB547}.st-undone{--sc:#FF8A4C}.st-zero{--sc:#FF5470}.st-absent{--sc:#a3a8c7}
.st-pending{--sc:#8B7BFF}.st-rest{--sc:#6B7096}.st-future{--sc:rgba(255,255,255,.18)}.st-na{--sc:rgba(255,255,255,.12)}

/* ---------- 通用控件 ---------- */
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);padding:9px 16px;border-radius:12px;cursor:pointer;transition:.2s;white-space:nowrap;position:relative;overflow:hidden}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn.primary{border:0;background:linear-gradient(135deg,#8B7BFF,#FF6FB5);box-shadow:0 8px 24px -8px rgba(255,111,181,.8);font-weight:700}
.btn.gold{border:0;background:linear-gradient(135deg,#FFD36E,#FF9F43);color:#3a2300;font-weight:800;box-shadow:0 8px 24px -8px rgba(255,180,70,.8)}
.btn.danger{border-color:rgba(255,84,112,.45);color:#FF8FA3;background:rgba(255,84,112,.08)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none;transition:.2s}
.inp:focus{border-color:rgba(139,123,255,.8);box-shadow:0 0 0 4px rgba(139,123,255,.18)}
select.inp option{background:#141530}
textarea.inp{min-height:84px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.hint{font-size:12px;color:var(--dim);line-height:1.7}
.empty{text-align:center;padding:26px 10px}
.empty-ico{font-size:58px;animation:bob 3s ease-in-out infinite}
.empty h3{margin:10px 0 6px;font-size:20px}
.empty .row{justify-content:center;max-width:380px;margin:16px auto 8px;flex-wrap:nowrap}

.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd label{cursor:pointer}
.wd input{display:none}
.wd span{display:inline-block;width:40px;padding:8px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s}
.wd input:checked+span{background:linear-gradient(135deg,#8B7BFF,#FF6FB5);border-color:transparent;font-weight:700}

/* ---------- 日历 ---------- */
.cal-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-title{font-size:24px;font-weight:800;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .wh{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:92px;padding:8px 10px;border-radius:14px;cursor:pointer;transition:.25s;
  background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 20%,transparent),rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb,var(--sc) 38%,rgba(255,255,255,.06))}
.cell:hover{transform:translateY(-3px) scale(1.02);z-index:2;box-shadow:0 12px 30px -10px color-mix(in srgb,var(--sc) 70%,transparent)}
.cell.st-normal{box-shadow:0 0 22px -10px var(--sc)}
.cell .dn{font-size:16px;font-weight:800}
.cell .di{position:absolute;right:8px;top:6px;font-size:18px}
.cell .dt{font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.cell .dl{font-size:11px;color:var(--sc);margin-top:3px;font-weight:600}
.cell.st-rest .dl,.cell.st-future .dl,.cell.st-na .dl{color:var(--dim)}
.cell.today{outline:2px solid #fff;outline-offset:2px}
.cell.blank{visibility:hidden}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}

  background:repeating-conic-gradient(from 0deg,rgba(255,211,110,.22) 0 8deg,transparent 8deg 20deg);

<div id="app">
  <header class="topbar">

<script>
(() => {
'use strict';

/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const pdate = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const minOf = ts => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const fmtT = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTS = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const r2 = n => Math.round(n * 100) / 100;
const money = n => '¥' + r2(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pick = a => a[Math.floor(Math.random() * a.length)];
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const cnDate = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
const cnMonth = (y, m) => `${y}年${m + 1}月`;
const ratioTxt = r => (+r === 1 ? '全薪' : +r === 0.5 ? '半薪' : +r === 0 ? '无薪' : Math.round(r * 100) + '%');
const durTxt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };

/* ================= 数据 ================= */
const KEY = 'starpunch.data.v1';
const DEF = () => ({
  v: 1,
  settings: {
    company: '星光团队', salary: 3000, payDay: 15, inDL: '11:00', taskDL: '16:00',
    workdays: [1, 2, 3, 4, 5], undoneRatio: 0.5, adminPin: '', sound: true,
    installedAt: dkey(new Date()), lastBackup: 0
  },
  employees: [], records: {}, payrolls: [], badges: {}, celebrated: {}
});
function migrate(d) {
  const def = DEF();
  d.settings = Object.assign(def.settings, d.settings || {});
  ['employees', 'payrolls'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  ['records', 'badges', 'celebrated'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { console.error(e); }
  return DEF();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('保存失败：' + e.message, 'err'); }
}
save();

const UI = {
  tab: 'punch', emp: null, admin: false, modals: 0,
  cal: { y: new Date().getFullYear(), m: new Date().getMonth(), emp: null },
  honorEmp: null
};
try { UI.emp = localStorage.getItem('starpunch.lastEmp'); } catch (e) {}

/* ================= 规则引擎 ================= */
const isWorkday = d => S.settings.workdays.includes(d.getDay());
function countWorkdays(y, m) {
  const n = new Date(y, m + 1, 0).getDate(); let c = 0;
  for (let i = 1; i <= n; i++) if (isWorkday(new Date(y, m, i))) c++;
  return c;
}
const activeEmps = () => S.employees.filter(e => e.active !== false);
const empById = id => S.employees.find(e => e.id === id);
const rateOf = (emp, y, m) => { const wd = countWorkdays(y, m); return wd ? emp.salary / wd : 0; };
const recKey = (id, ds) => id + '|' + ds;

/**
 * 判定某员工某天的出勤结果
 * 正常：11:00 前上班卡 且 16:00 前任务完成卡 → 100%
 * 迟到：11:00 及之后上班卡，16:00 前完成 → 50%
 * 迟到且未完成 → 0
 * 准时但 16:00 前未完成 → 由设置决定（默认 50%）
 */
function evalDay(emp, ds, now = new Date()) {
  const st = S.settings, rec = S.records[recKey(emp.id, ds)] || null;
  const work = isWorkday(pdate(ds)), today = dkey(now);
  const inDL = hm(st.inDL), tDL = hm(st.taskDL), nowM = minOf(now.getTime());
  const base = { rec, work, ds };
  if (emp.hireDate && ds < emp.hireDate) return { ...base, code: 'na', ratio: 0, final: true, label: '未入职' };
  if (emp.leftAt && ds > emp.leftAt) return { ...base, code: 'na', ratio: 0, final: true, label: '已停用' };
  if (!work) return { ...base, code: 'rest', ratio: 0, final: true, label: rec && rec.in ? '休息日也来了' : '休息日' };
  if (ds > today) return { ...base, code: 'future', ratio: 0, final: false, label: '' };
  const isToday = ds === today;
  const hasIn = !!(rec && rec.in), hasDone = !!(rec && rec.done);
  const onTime = hasIn && minOf(rec.in) < inDL;
  const doneOk = hasDone && minOf(rec.done) < tDL;
  if (!hasIn) {
    if (isToday && nowM < tDL) return { ...base, code: 'waiting', ratio: 0, final: false, potential: nowM < inDL ? 1 : 0.5, label: '待打卡' };
    return { ...base, code: 'absent', ratio: 0, final: true, label: '缺勤' };
  }
  if (doneOk) return onTime
    ? { ...base, code: 'normal', ratio: 1, final: true, label: '正常出勤' }
    : { ...base, code: 'late', ratio: 0.5, final: true, label: '迟到 · 半薪' };
  if (isToday && nowM < tDL && !hasDone) return { ...base, code: 'working', ratio: 0, final: false, potential: onTime ? 1 : 0.5, label: '工作中' };
  if (onTime) { const r = +st.undoneRatio; return { ...base, code: 'undone', ratio: r, final: true, label: '任务超时 · ' + ratioTxt(r) }; }
  return { ...base, code: 'zero', ratio: 0, final: true, label: '迟到且超时 · 无薪' };
}
const META = {
  normal: { c: 'st-normal', i: '✨' }, late: { c: 'st-late', i: '🌤️' }, undone: { c: 'st-undone', i: '⏳' },
  zero: { c: 'st-zero', i: '🌧️' }, absent: { c: 'st-absent', i: '💤' }, rest: { c: 'st-rest', i: '☕' },
  future: { c: 'st-future', i: '' }, waiting: { c: 'st-pending', i: '⌛' }, working: { c: 'st-pending', i: '💼' }, na: { c: 'st-na', i: '' }
};

function computeMonth(emp, y, m, now = new Date()) {
  const n = new Date(y, m + 1, 0).getDate(), wd = countWorkdays(y, m), rate = wd ? emp.salary / wd : 0;
  const counts = { normal: 0, late: 0, undone: 0, zero: 0, absent: 0, pending: 0 };
  let amount = 0, eligible = 0, maxPossible = 0;
  for (let i = 1; i <= n; i++) {
    const ds = dkey(new Date(y, m, i)), ev = evalDay(emp, ds, now);
    if (!ev.work || ev.code === 'na' || ev.code === 'rest') continue;
    eligible++;
    if (ev.final) { counts[ev.code]++; amount += ev.ratio * rate; maxPossible += ev.ratio * rate; }
    else if (ev.code === 'future') maxPossible += rate;
    else { counts.pending++; maxPossible += (ev.potential || 0) * rate; }
  }
  return { workdays: wd, eligible, rate, counts, amount: r2(amount), maxPossible: r2(maxPossible) };
}

function calcStreak(emp, now = new Date()) {
  let n = 0; const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (let i = 0; i < 600; i++) {
    const ev = evalDay(emp, dkey(d), now);
    if (ev.code === 'normal') n++;
    else if (ev.code === 'rest' || !ev.final) { /* 跳过 */ }
    else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
const empRecords = id => Object.entries(S.records).filter(([k]) => k.startsWith(id + '|')).map(([k, rec]) => ({ ds: k.slice(id.length + 1), rec }));

/* ================= 发薪结算 ================= */
function nextPayDate(now = new Date()) {
  const pd = S.settings.payDay;
  let d = new Date(now.getFullYear(), now.getMonth(), pd);
  if (dkey(now) > dkey(d)) d = new Date(now.getFullYear(), now.getMonth() + 1, pd);
  return d;
}
function snapPayroll(emp, y, m, payDate) {
  const c = computeMonth(emp, y, m);
  return {
    id: uid(), empId: emp.id, empName: emp.name, avatar: emp.avatar, period: mkey(y, m), payDate,
    salary: emp.salary, workdays: c.workdays, eligible: c.eligible, rate: r2(c.rate), counts: c.counts,
    amount: c.amount, createdAt: Date.now(), paid: false, paidAt: null
  };
}
// 每月 15 日自动生成上一个自然月的工资结算记录
function ensurePayrolls(now = new Date()) {
  const st = S.settings; const fresh = [];
  let [y, m] = st.installedAt.split('-').map(Number); m -= 1;
  for (let g = 0; g < 600; g++) {
    const pay = new Date(y, m + 1, st.payDay);
    if (now < pay) break;
    const pk = mkey(y, m), first = dkey(new Date(y, m, 1)), last = dkey(new Date(y, m + 1, 0));
    for (const e of S.employees) {
      if (e.hireDate && e.hireDate > last) continue;
      if (e.leftAt && e.leftAt < first) continue;
      if (dkey(new Date(e.createdAt || 0)) > dkey(pay)) continue;
      if (S.payrolls.some(p => p.empId === e.id && p.period === pk)) continue;
      const p = snapPayroll(e, y, m, dkey(pay)); S.payrolls.push(p); fresh.push(p);
    }
    m++; if (m > 11) { m = 0; y++; }
  }
  if (fresh.length) { save(); fresh.forEach(p => { const e = empById(p.empId); if (e) checkBadges(e); }); }
  return fresh;
}
function recalcPayroll(p) {
  const e = empById(p.empId); if (!e || p.paid) return false;
  const [y, m] = p.period.split('-').map(Number);
  const n = snapPayroll(e, y, m - 1, p.payDate);
  Object.assign(p, { empName: e.name, avatar: e.avatar, salary: n.salary, workdays: n.workdays, eligible: n.eligible, rate: n.rate, counts: n.counts, amount: n.amount, recalcAt: Date.now() });
  return true;
}

/* ================= 成就 ================= */
const BADGES = [
  { k: 'first', i: '🌱', n: '初来乍到', d: '完成第一次上班打卡' },
  { k: 'early', i: '🐦', n: '早起的鸟儿', d: '9:00 前完成上班打卡' },
  { k: 'firstDone', i: '🎯', n: '使命必达', d: '第一次正常出勤（准时 + 任务按时完成）' },

function checkBadges(emp) {
  const st = S.settings, inDL = hm(st.inDL), tDL = hm(st.taskDL);
  const recs = empRecords(emp.id), got = [];
  if (recs.some(r => r.rec.in)) got.push('first');
  if (recs.some(r => r.rec.in && minOf(r.rec.in) < 9 * 60)) got.push('early');
  const normals = recs.filter(r => r.rec.in && r.rec.done && minOf(r.rec.in) < inDL && minOf(r.rec.done) < tDL && isWorkday(pdate(r.ds))).length;
  if (normals >= 1) got.push('firstDone');
  if (normals >= 10) got.push('t10');
  if (normals >= 50) got.push('t50');
  if (recs.some(r => r.rec.in && r.rec.done && minOf(r.rec.in) >= inDL && minOf(r.rec.done) < tDL)) got.push('comeback');
  const s = calcStreak(emp);
  if (s >= 3) got.push('s3'); if (s >= 7) got.push('s7'); if (s >= 15) got.push('s15'); if (s >= 30) got.push('s30');
  if (S.payrolls.some(p => p.empId === emp.id && p.eligible > 0 && p.counts.normal === p.eligible)) got.push('full');
  const mine = S.badges[emp.id] = S.badges[emp.id] || {};
  const newly = got.filter(k => !mine[k]);
  newly.forEach(k => { mine[k] = Date.now(); });
  if (newly.length) save();
  return newly.map(k => BADGES.find(b => b.k === k));
}

const TL = { start: 7 * 60, end: 19 * 60 };
function buildTimeline() {
  const st = S.settings, inDL = hm(st.inDL), tDL = hm(st.taskDL);
  TL.start = Math.max(0, Math.min(7 * 60, inDL - 180)); TL.end = Math.min(1440, Math.max(19 * 60, tDL + 180));
  const pct = v => ((v - TL.start) / (TL.end - TL.start) * 100).toFixed(2) + '%';
  let ticks = '';
  for (let h = Math.ceil(TL.start / 60); h * 60 <= TL.end; h += 2) ticks += `<div class="tl-tick" style="left:${pct(h * 60)}">${pad(h)}:00</div>`;
  $('#timeline').innerHTML = `
    <div class="tl-mark" style="left:${pct(inDL)};color:var(--mint)">⏰ ${st.inDL} 上班截止</div>
    <div class="tl-mark" style="left:${pct(tDL)};color:var(--gold)">🎯 ${st.taskDL} 任务截止</div>
    <div class="tl-bar">
      <div class="tl-seg" style="left:0;width:${pct(inDL)};background:linear-gradient(90deg,rgba(62,240,181,.15),rgba(62,240,181,.55))"></div>
      <div class="tl-seg" style="left:${pct(inDL)};width:calc(${pct(tDL)} - ${pct(inDL)});background:linear-gradient(90deg,rgba(139,123,255,.45),rgba(255,111,181,.55))"></div>
      <div class="tl-seg" style="left:${pct(tDL)};right:0;background:rgba(255,255,255,.05)"></div>
      <div class="tl-fill" id="tlFill"></div>
    </div>
    ${ticks}<div id="tlDots"></div><div class="tl-now" id="tlNow"></div>`;
  TL.pct = pct;
}

    const toTs = v => { if (!v) return null; const [h, mi, s] = v.split(':').map(Number); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi || 0, s || 0).getTime(); };

function saveSettings() {
  const st = S.settings, inDL = $('#sIn').value, taskDL = $('#sTask').value, payDay = +$('#sPayDay').value, salary = +$('#sSalary').value;
  const wds = $$('.wd input:checked').map(i => +i.value);
  if (!inDL || !taskDL) { toast('请填写完整的截止时间', 'err'); return; }
  if (hm(taskDL) <= hm(inDL)) { toast('任务截止时间应晚于上班截止时间', 'err'); return; }
  if (!(payDay >= 1 && payDay <= 28)) { toast('发薪日需在 1–28 之间', 'err'); return; }
  if (!wds.length) { toast('至少选择一个工作日', 'err'); return; }
  if (!(salary >= 0)) { toast('默认月薪格式不正确', 'err'); return; }
  Object.assign(st, { company: $('#sCompany').value.trim(), inDL, taskDL, payDay, salary, workdays: wds, undoneRatio: +$('#sUndone').value });
  save(); buildTimeline(); ensurePayrolls(); toast('设置已保存 ✓', 'ok'); render();
}
async function setPin() {

function exportData() {

function importData(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.employees) || typeof d.records !== 'object') throw new Error('文件格式不正确');
      if (!await confirmBox({ title: '从备份恢复？', text: `备份包含 ${d.employees.length} 位员工、${Object.keys(d.records || {}).length} 条打卡记录。<br><b style="color:var(--red)">当前数据将被覆盖。</b>`, okText: '恢复', danger: true })) return;
      S = migrate(d); save(); UI.admin = false; buildTimeline(); ensurePayrolls(); toast('数据已恢复 ✓', 'ok'); render(true);
    } catch (e) { toast('恢复失败：' + e.message, 'err'); }
  };
  r.readAsText(file);
}
async function clearData() {

  if (v !== '清空') { if (v != null) toast('输入不匹配，已取消'); return; }
  S = DEF(); save(); UI.admin = false; UI.emp = null; buildTimeline(); toast('已清空，一切重新开始 🌱'); render(true);
}

/* ================= 事件分发 ================= */
async function act(a, el) {
  switch (a) {
    case 'tab': Snd.tap(); switchTab(el.dataset.tab); break;
    case 'sound': S.settings.sound = !S.settings.sound; save(); renderTop(); if (S.settings.sound) Snd.badge(); break;
    case 'pick': { const c = elCenter(el); UI.emp = el.dataset.id; try { localStorage.setItem('starpunch.lastEmp', UI.emp); } catch (e) {} Snd.tap(); if (UI.tab === 'punch') renderPunch(true); FX.sparkle(c[0], c[1], 24); break; }
    case 'punch-in': await punchIn(el); break;
    case 'punch-done': await punchDone(el); break;
    case 'quick-add': {
      const name = ($('#qaName') || {}).value?.trim(); if (!name) { toast('请输入员工姓名', 'err'); return; }
      const e = { id: uid(), name, avatar: pick(AVATARS), salary: S.settings.salary, hireDate: dkey(new Date()), pin: '', active: true, createdAt: Date.now() };
      S.employees.push(e); UI.emp = e.id; save(); render(true); Snd.win(); FX.confetti(120);
      celebrate({ emoji: e.avatar, title: `欢迎 ${name} 加入！`, sub: '新的伙伴，新的星光。现在就可以开始打卡啦 ✨', okText: '开始打卡！' });
      break;
    }
    case 'cal-prev': UI.cal.m--; if (UI.cal.m < 0) { UI.cal.m = 11; UI.cal.y--; } renderCalendar(); break;
    case 'cal-next': UI.cal.m++; if (UI.cal.m > 11) { UI.cal.m = 0; UI.cal.y++; } renderCalendar(); break;
    case 'cal-today': UI.cal.y = new Date().getFullYear(); UI.cal.m = new Date().getMonth(); renderCalendar(); break;
    case 'day': dayDetail(el.dataset.ds); break;
    case 'att-export': {
      const emp = empById(UI.cal.emp); if (!emp) return; const { y, m } = UI.cal, n = new Date(y, m + 1, 0).getDate(), now = new Date();
      const rate = rateOf(emp, y, m);
      const lines = [['员工', '日期', '星期', '上班打卡', '任务完成', '状态', '当日工资', '工作记录', '是否补卡'].join(',')];
      for (let d = 1; d <= n; d++) { const dt = new Date(y, m, d), ds = dkey(dt), ev = evalDay(emp, ds, now), r = ev.rec || {};
        lines.push([emp.name, ds, '周' + WEEK[dt.getDay()], r.in ? fmtTS(r.in) : '', r.done ? fmtTS(r.done) : '', ev.label, ev.final && ev.work ? r2(ev.ratio * rate) : '', r.note || '', r.edited ? '是' : ''].map(csvCell).join(',')); }
      download(`考勤_${emp.name}_${mkey(y, m)}.csv`, lines.join('\r\n')); toast('考勤表已导出 ✓', 'ok'); break;
    }
    case 'pay-export': {
      const lines = [['发放日期', '结算月份', '员工', '月薪', '工作日', '应出勤', '正常', '迟到半薪', '任务超时', '无薪', '缺勤', '日薪', '实发工资', '状态', '发放时间'].join(',')];
      [...S.payrolls].sort((a, b) => b.payDate.localeCompare(a.payDate)).forEach(p => lines.push([p.payDate, p.period, p.empName, p.salary, p.workdays, p.eligible, p.counts.normal, p.counts.late, p.counts.undone, p.counts.zero, p.counts.absent, p.rate, p.amount, p.paid ? '已发放' : '待发放', p.paidAt ? new Date(p.paidAt).toLocaleString('zh-CN') : ''].map(csvCell).join(',')));
      download(`工资结算记录_${dkey(new Date())}.csv`, lines.join('\r\n')); toast('结算记录已导出 ✓', 'ok'); break;
    }
    case 'pay-slip': { const p = S.payrolls.find(x => x.id === el.dataset.id); if (p) payslip(p); break; }
    case 'pay-recalc': { if (!await requireAdmin()) return; const p = S.payrolls.find(x => x.id === el.dataset.id); if (p && recalcPayroll(p)) { save(); toast('已按最新考勤重新计算 ✓', 'ok'); render(); } break; }
    case 'pay-mark': case 'pay-all': {
      if (!await requireAdmin()) return;
      const list = a === 'pay-all' ? S.payrolls.filter(p => p.payDate === el.dataset.date && !p.paid) : S.payrolls.filter(p => p.id === el.dataset.id);
      if (!list.length) return;
      const tot = list.reduce((s, p) => s + p.amount, 0);
      if (!await confirmBox({ title: '确认发放工资？', icon: '💸', text: `共 ${list.length} 人，合计 <b style="color:var(--gold)">${money(tot)}</b>。<br>标记后结算记录将锁定，不再随考勤修改变化。`, okText: '确认已发放' })) return;
      list.forEach(p => { p.paid = true; p.paidAt = Date.now(); }); save(); render();
      Snd.coin(); FX.coins(70); FX.fireworks(5, FX.PAL[0]);
      celebrate({ emoji: '💸', title: '工资已发放！', sub: '感谢每一位伙伴的付出，这是大家应得的回报 💜', amount: tot, amountLabel: '本次发放合计' });
      break;
    }
    case 'pay-unmark': { if (!await requireAdmin()) return; const p = S.payrolls.find(x => x.id === el.dataset.id); if (p && await confirmBox({ title: '撤销发放状态？', text: '撤销后该记录恢复为「待发放」。' })) { p.paid = false; p.paidAt = null; save(); render(); } break; }
    case 'admin-unlock': if (await requireAdmin()) render(true); break;
    case 'admin-lock': UI.admin = false; toast('管理区已锁定 🔒'); render(true); break;
    case 'emp-add': if (await requireAdmin()) empForm(null); break;
    case 'emp-edit': if (await requireAdmin()) empForm(empById(el.dataset.id)); break;
    case 'emp-toggle': {
      if (!await requireAdmin()) return; const e = empById(el.dataset.id); if (!e) return;
      if (e.active === false) { e.active = true; delete e.leftAt; toast(`${e.name} 已重新启用 ✓`, 'ok'); }
      else { if (!await confirmBox({ title: `停用 ${e.name}？`, text: '停用后不再出现在打卡页，历史记录和结算会保留。从明天起不再计考勤。', okText: '停用' })) return; e.active = false; e.leftAt = dkey(new Date()); }
      save(); render(); break;
    }
    case 'emp-del': {
      if (!await requireAdmin()) return; const e = empById(el.dataset.id); if (!e) return;
      if (!await confirmBox({ title: `删除 ${e.name}？`, danger: true, okText: '永久删除', text: '该员工的所有打卡记录与成就将被删除（已生成的工资结算记录会保留）。<br>如果只是离职，建议使用「停用」。' })) return;
      S.employees = S.employees.filter(x => x.id !== e.id);
      Object.keys(S.records).forEach(k => { if (k.startsWith(e.id + '|')) delete S.records[k]; });
      delete S.badges[e.id]; save(); toast('已删除'); render(); break;
    }
    case 'set-save': saveSettings(); break;
    case 'set-pin': await setPin(); break;
    case 'data-export': exportData(); break;
    case 'data-import': $('#importFile').click(); break;
    case 'data-clear': await clearData(); break;
  }
}

  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('pbtn') || el.classList.contains('btn')) {
    const r = el.getBoundingClientRect(), s = Math.max(r.width, r.height), rp = document.createElement('span');
    rp.className = 'ripple'; rp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    el.appendChild(rp); setTimeout(() => rp.remove(), 700);
  }
  const a = el.dataset.act;
  if (a === 'punch-in' || a === 'punch-done') { if (busy) return; busy = true; try { await act(a, el); } finally { busy = false; } }
  else act(a, el);
});
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
addEventListener('resize', moveInd);

/* ================= 渲染 & 时钟 ================= */
function render(anim = false) {
  renderTop();
  if (UI.tab === 'punch') renderPunch(anim);
  else if (UI.tab === 'calendar') renderCalendar();
  else if (UI.tab === 'payroll') renderPayroll();
  else if (UI.tab === 'honor') renderHonor();
  else if (UI.tab === 'admin') renderAdmin();
}
let lastMin = -1, lastDay = dkey(new Date());
function tick() {
  const now = new Date(), st = S.settings;
  setDigit($('#ckH'), pad(now.getHours())); setDigit($('#ckM'), pad(now.getMinutes())); setDigit($('#ckS'), pad(now.getSeconds()));
  $('#ckDate').textContent = `${cnDate(now)} · 星期${WEEK[now.getDay()]}${isWorkday(now) ? ' · 工作日' : ' · 休息日 ☕'}`;
  const nowM = minOf(now.getTime()), inDL = hm(st.inDL), tDL = hm(st.taskDL);
  const cdIn = $('#cdIn'), cdT = $('#cdTask');
  if (nowM < inDL) { cdIn.className = 'cd ok'; cdIn.innerHTML = `<div class="k">⏰ 距上班打卡截止（${st.inDL}）</div><div class="v">${durTxt((inDL - nowM) * 60000)}</div>`; }
  else { cdIn.className = 'cd over'; cdIn.innerHTML = `<div class="k">⏰ 上班打卡截止（${st.inDL}）</div><div class="v">已过截止时间</div>`; }
  if (nowM < tDL) { cdT.className = 'cd ' + (tDL - nowM < 60 ? 'warn' : 'ok'); cdT.innerHTML = `<div class="k">🎯 距任务完成截止（${st.taskDL}）</div><div class="v">${durTxt((tDL - nowM) * 60000)}</div>`; }
  else { cdT.className = 'cd over'; cdT.innerHTML = `<div class="k">🎯 任务完成截止（${st.taskDL}）</div><div class="v">今日已截止 · 辛苦了</div>`; }
  if (TL.pct) {
    const v = Math.max(TL.start, Math.min(TL.end, now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60));
    const n = $('#tlNow'), f = $('#tlFill'); if (n) n.style.left = TL.pct(v); if (f) f.style.width = TL.pct(v);
  }
  if (UI.tab === 'payroll') tickPayroll();
  const ds = dkey(now), mm = now.getHours() * 60 + now.getMinutes();
  if (ds !== lastDay) { lastDay = ds; lastMin = mm; afterDayChange(); }
  else if (mm !== lastMin) { lastMin = mm; if (!UI.modals && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render(); }
  setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
}
function afterDayChange() {
  const fresh = ensurePayrolls();
  render();
  paydayCheck(fresh);
}
function paydayCheck() {
  const today = dkey(new Date()), list = S.payrolls.filter(p => p.payDate === today);
  if (!list.length || S.celebrated[today]) return;
  S.celebrated[today] = true; save();
  const tot = list.reduce((s, p) => s + p.amount, 0), [py, pm] = list[0].period.split('-').map(Number);
  setTimeout(() => {
    Snd.coin(); FX.coins(90); FX.fireworks(8); setTimeout(() => FX.confetti(160), 600);
    celebrate({ emoji: '💰', title: '今天是发薪日！', sub: `${py}年${pm}月的工资已全部结算完成，共 ${list.length} 位伙伴。辛苦一个月，今天值得好好犒劳自己 🎉`, amount: tot, amountLabel: '本次结算合计', okText: '去看结算明细 →' })
      .then(v => { if (v) switchTab('payroll'); });
  }, 800);
}
setInterval(() => rotateQuote(false), 16000);

/* ================= 启动 ================= */
buildTimeline();
rotateQuote(true);
ensurePayrolls();
render(true);
requestAnimationFrame(moveInd);
setTimeout(moveInd, 300);
setTimeout(() => $('#tab-punch').classList.remove('enter'), 1600);
tick();
paydayCheck();
})();
</script>
</body>
